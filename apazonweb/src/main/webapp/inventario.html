<html>
    <head>
        <title>Inventario</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    </head>
    <body>
        <h2 style="color: blue; text-align: center;">Inventario General</h2>
        <button id="btnProducto">Productos</button>
        <hr />
        <div id="resultado">       
        </div>
        <script>
            $(document).ready(function () {
                $("#btnProducto").click(function () {
                    $.ajax({
                        url: "procesa.jsp",
                        cache: false,
                        beforeSend: function () {
                            $("#resultado").html("<img src='img/loading.gif' width='40px' height='40px' alt='Espere...' />");
                        },
                        success: function (result) {
                            const resultado = result;
                            const resp = typeof result === 'string' ? JSON.parse(result) : result;
                            if (Array.isArray(resp)) {
                                let salida = "<table><tbody>";
                                let contador = 0;
                                resp.forEach(p => {
                                    contador += 1;
                                    salida += "<tr>";
                                    salida += `<td>${contador}</td>`;
                                    salida += `<td>${p.nombre}</td>`;
                                    salida += `<td>${p.descripcion}</td>`;
                                    salida += `<td>${p.precio}</td>`;
                                    salida += "</tr>";

                                });
                                salida += "</tbody></table>";
                                $("#resultado").html(salida);
                            }
                        }
                    });
                });
            });
        </script>
    </body>
</html>
